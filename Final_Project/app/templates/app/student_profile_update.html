{% extends 'app/base.html' %} {% load crispy_forms_tags %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Update Student Profile</h4>
      </div>
      <div class="card-body">
        <form method="POST">
          {% csrf_token %}

          <div class="alert alert-info">
            Please provide your academic details. These will be visible to your
            coordinator.
          </div>

          {{ form|crispy }}

          <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
            <a href="{% url 'dashboard' %}" class="btn btn-secondary me-md-2"
              >Cancel</a
            >
            <button type="submit" class="btn btn-success">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
